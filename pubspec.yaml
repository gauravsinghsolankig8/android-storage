name: echobuddy
description: Advanced AR AI Friend with voice, emotions, memory, and deep personalization

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # AR & 3D
  ar_flutter_plugin: ^0.7.3
  flutter_unity_widget: ^2022.2.2
  model_viewer_plus: ^1.7.0
  
  # AI & Voice
  openai_client: ^0.4.1
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.3
  avatar_glow: ^2.0.2
  
  # Animation & UI
  lottie: ^2.7.0
  rive: ^0.12.4
  flutter_animate: ^4.3.0
  animated_text_kit: ^4.2.2
  confetti: ^0.7.0
  
  # State Management
  provider: ^6.1.1
  get: ^4.6.6
  
  # Storage & Database
  supabase_flutter: ^2.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # Permissions & Platform
  permission_handler: ^11.0.1
  camera: ^0.10.5+5
  
  # UI Components
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Utils
  uuid: ^4.1.0
  intl: ^0.18.1
  path_provider: ^2.1.1
  package_info_plus: ^4.2.0
  
  # Payment
  razorpay_flutter: ^1.3.7
  
  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  
  # Audio
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/3d_models/
    - assets/animations/
    - assets/audio/
    - assets/lottie/
    - assets/rive/
    
  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/CustomFont-Regular.ttf
        - asset: assets/fonts/CustomFont-Bold.ttf
          weight: 700